---
# Patching is inherently stateful and reboot-shaped, which a container cannot
# fully model. This scenario proves the parts that are testable without a
# hypervisor: pre-flight gating, the patch transaction itself, reboot detection

driver:
  name: docker

platforms:
  - name: rocky9-patch
    image: rockylinux/rockylinux:9
    pre_build_image: true
    command: /usr/sbin/init
    tmpfs:
      /run: rw,noexec,nosuid,size=65536k
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: ubuntu2204-patch
    image: ubuntu:22.04
    pre_build_image: true
    command: /lib/systemd/systemd
    tmpfs:
      /run: rw,noexec,nosuid,size=65536k
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: yaml

verifier:
  name: ansible

scenario:
  # No idempotence step: `state: latest` is not idempotent by definition when a
  # new package lands upstream between the two runs. Asserting it would produce
  # a test that fails at random times of day for reasons unrelated to the code.
  test_sequence: [dependency, destroy, syntax, create, prepare, converge, verify, destroy]
