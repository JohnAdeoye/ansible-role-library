---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install tools the role expects
      ansible.builtin.package:
        name: "{{ ['procps'] if ansible_os_family == 'Debian' else ['procps-ng', 'dnf-utils'] }}"
        state: present

    # Something for the patch run to consider. `curl` cannot be installed on
    # RHEL 9 derivatives — it conflicts with the curl-minimal the base image
    # already carries — so each family gets the name it can actually resolve.
    - name: Install a package the patch run can update
      ansible.builtin.package:
        name: "{{ 'curl' if ansible_os_family == 'Debian' else 'curl-minimal' }}"
        state: present
