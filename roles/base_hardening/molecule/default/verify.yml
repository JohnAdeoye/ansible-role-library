---
# Verify asserts on rendered artifacts, not on the role's own change reporting.
# Checking that a task said "changed" only proves Ansible ran; checking the file
# contents proves the control is actually in place.

- name: Verify
  hosts: all
  # No become: the container is entered as root already, and escalating
  # root->root still goes through sudo, whose PAM stack is not functional in
  # these images. The roles never escalate on their own.
  gather_facts: true

  tasks:
    # ----------------------------------------------------------------- SSH (5.2)
    - name: Read the rendered sshd_config
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Decode sshd_config
      ansible.builtin.set_fact:
        sshd: "{{ sshd_config.content | b64decode }}"

    - name: Assert SSH hardening directives are present
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in sshd"
          - "'PasswordAuthentication no' in sshd"
          - "'PermitEmptyPasswords no' in sshd"
          - "'X11Forwarding no' in sshd"
          - "'MaxAuthTries 4' in sshd"
          - "'HostbasedAuthentication no' in sshd"
          - "'IgnoreRhosts yes' in sshd"
          - "'AllowGroups wheel' in sshd"
          - "'Banner /etc/issue.net' in sshd"
        fail_msg: "sshd_config is missing one or more CIS 5.2 directives"
        quiet: true

    - name: Assert weak SSH algorithms are excluded
      ansible.builtin.assert:
        that:
          - "'3des' not in sshd"
          - "'hmac-md5' not in sshd"
          - "'diffie-hellman-group1-sha1' not in sshd"
          - "'arcfour' not in sshd"
        fail_msg: "sshd_config still permits a weak algorithm"
        quiet: true

    - name: Assert sshd_config parses
      ansible.builtin.command:
        cmd: sshd -t -f /etc/ssh/sshd_config
      changed_when: false

    - name: Assert sshd_config permissions
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_stat

    - name: Check sshd_config is 0600 root:root
      ansible.builtin.assert:
        that:
          - sshd_stat.stat.mode == '0600'
          - sshd_stat.stat.pw_name == 'root'
        quiet: true

    # ------------------------------------------------------------ password (5.3)
    - name: Read pwquality.conf
      ansible.builtin.slurp:
        src: /etc/security/pwquality.conf
      register: pwquality

    - name: Assert password quality policy
      ansible.builtin.assert:
        that:
          - "'minlen = 14' in (pwquality.content | b64decode)"
          - "'dcredit = -1' in (pwquality.content | b64decode)"
          - "'ucredit = -1' in (pwquality.content | b64decode)"
          - "'lcredit = -1' in (pwquality.content | b64decode)"
          - "'ocredit = -1' in (pwquality.content | b64decode)"
        fail_msg: "pwquality.conf does not meet CIS 5.3.1"
        quiet: true

    - name: Read faillock.conf
      ansible.builtin.slurp:
        src: /etc/security/faillock.conf
      register: faillock

    - name: Assert lockout policy
      ansible.builtin.assert:
        that:
          - "'deny = 5' in (faillock.content | b64decode)"
          - "'unlock_time = 900' in (faillock.content | b64decode)"
        quiet: true

    # ------------------------------------------------------------- accounts (5.4)
    - name: Read login.defs
      ansible.builtin.slurp:
        src: /etc/login.defs
      register: login_defs

    - name: Assert password ageing and umask policy
      ansible.builtin.assert:
        that:
          - "'PASS_MAX_DAYS' in (login_defs.content | b64decode)"
          - "'365' in (login_defs.content | b64decode)"
          - "'027' in (login_defs.content | b64decode)"
        quiet: true

    - name: Assert the TMOUT profile script exists
      ansible.builtin.stat:
        path: /etc/profile.d/99-cis-tmout.sh
      register: tmout

    - name: Check TMOUT is set
      ansible.builtin.assert:
        that: [tmout.stat.exists]
        quiet: true

    - name: Assert root is the only UID 0 account
      ansible.builtin.command:
        cmd: "awk -F: '$3 == 0 { print $1 }' /etc/passwd"
      register: uid_zero
      changed_when: false

    - name: Check UID 0 accounts
      ansible.builtin.assert:
        that:
          - uid_zero.stdout_lines == ['root']
        fail_msg: "Unexpected UID 0 accounts: {{ uid_zero.stdout_lines }}"
        quiet: true

    # ----------------------------------------------------------------- audit (4.1)
    - name: Read the audit rules
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/99-cis.rules
      register: audit_rules

    - name: Assert key audit rules are present
      ansible.builtin.assert:
        that:
          - "'-k time-change' in (audit_rules.content | b64decode)"
          - "'-k identity' in (audit_rules.content | b64decode)"
          - "'-k perm_mod' in (audit_rules.content | b64decode)"
          - "'-k privileged' in (audit_rules.content | b64decode)"
          - "'-k modules' in (audit_rules.content | b64decode)"
          - "'-w /etc/sudoers -p wa -k scope' in (audit_rules.content | b64decode)"
        fail_msg: "audit rules are missing a CIS 4.1.3 requirement"
        quiet: true

    - name: Assert the audit rules are syntactically valid
      ansible.builtin.command:
        cmd: auditctl -R /etc/audit/rules.d/99-cis.rules
      register: auditctl_check
      changed_when: false
      # Loading rules needs a real kernel audit subsystem, which a container does
      # not have. A parse error and a permission error are distinguishable by message.
      failed_when:
        - auditctl_check.rc != 0
        - "'Operation not permitted' not in auditctl_check.stderr"
        - "'Error sending' not in auditctl_check.stderr"

    # ---------------------------------------------------------------- banner (1.7)
    - name: Read /etc/issue.net
      ansible.builtin.slurp:
        src: /etc/issue.net
      register: issue_net

    - name: Assert the banner has no OS version escapes
      ansible.builtin.assert:
        that:
          - "'\\\\m' not in (issue_net.content | b64decode)"
          - "'\\\\r' not in (issue_net.content | b64decode)"
          - "'\\\\s' not in (issue_net.content | b64decode)"
          - "'\\\\v' not in (issue_net.content | b64decode)"
          - "'authorised users only' in (issue_net.content | b64decode)"
        fail_msg: "/etc/issue.net leaks OS information or is missing the warning"
        quiet: true

    # -------------------------------------------------------- permissions (6.1)
    - name: Stat the shadow suite files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/passwd, /etc/shadow, /etc/group, /etc/gshadow]
      register: shadow_suite

    - name: Assert shadow suite permissions
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == 'root'
          - item.stat.mode in ['0644', '0000', '0640']
        fail_msg: "{{ item.item }} has mode {{ item.stat.mode }}"
        quiet: true
      loop: "{{ shadow_suite.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ------------------------------------------------------------ modprobe (1.1)
    - name: Read the filesystem module blacklist
      ansible.builtin.slurp:
        src: /etc/modprobe.d/99-cis-filesystems.conf
      register: modprobe_conf
      when: ansible_virtualization_type not in ['docker', 'container', 'containerd', 'podman']

    - name: Assert blocked filesystems are disabled
      ansible.builtin.assert:
        that:
          - "'install cramfs /bin/false' in (modprobe_conf.content | b64decode)"
          - "'install squashfs /bin/false' in (modprobe_conf.content | b64decode)"
        quiet: true
      when: modprobe_conf.content is defined
