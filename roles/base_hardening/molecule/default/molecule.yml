---
# Two platforms, because the whole point of the role is that RHEL and Ubuntu
# diverge and the vars/ split hides it. A single-platform scenario would not
# catch a wrong path or service name.
#
# The images carry systemd already. The stock rockylinux:9 and ubuntu:22.04
# images do not, so a container asking for an init command exits immediately
# with "stat /usr/sbin/init: no such file or directory".

driver:
  name: docker

platforms:
  - name: rocky9-hardening
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    # systemd in a container needs cgroup access and a real init. Without this,
    # every service task fails and the scenario tests nothing useful.
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: ubuntu2204-hardening
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  env:
    # Scenarios live at roles/<name>/molecule/, and molecule no longer puts the
    # library's roles/ on the search path, so a bare `include_role` name does
    # not resolve.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      stdout_callback: ansible.builtin.default
      result_format: yaml
  inventory:
    group_vars:
      all:
        # Never let the test scenario lock the container's own SSH or firewall in a
        # way that would make the verify step unreachable.
        base_hardening_firewall_enabled: false
        base_hardening_ssh_allow_groups: []

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence     # a second run must report zero changes
    - verify
    - destroy
