---
- name: Converge
  hosts: all
  # No become: the container is entered as root already, and escalating
  # root->root still goes through sudo, whose PAM stack is not functional in
  # these images. The roles never escalate on their own.
  tasks:
    - name: Apply the base_hardening role
      ansible.builtin.include_role:
        name: base_hardening
      vars:
        base_hardening_ssh_allow_groups: [wheel]
        base_hardening_pwquality_minlen: 14
        base_hardening_lockout_attempts: 5
