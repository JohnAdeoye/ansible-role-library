---
# CIS 4.1 — system auditing.

- name: Install the audit daemon
  ansible.builtin.package:
    name: "{{ base_hardening_auditd_package }}"
    state: present

- name: Configure auditd log retention
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Deploy CIS audit rules
  ansible.builtin.template:
    src: cis.rules.j2
    dest: /etc/audit/rules.d/99-cis.rules
    owner: root
    group: root
    mode: "0640"
  notify: Reload audit rules

# CIS 4.1.1.3 — audit records generated before auditd starts are lost unless the
# kernel buffers them. audit=1 on the kernel command line fixes that.
- name: Enable auditing for processes that start before auditd
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=(?!.*\baudit=1\b)"[^"]*)"'
    replace: '\1 audit=1"'
  register: base_hardening_grub_audit
  when:
    - not base_hardening_in_container | bool
    - base_hardening_enforce | bool

- name: Regenerate the GRUB configuration
  ansible.builtin.command:
    cmd: "{{ 'grub2-mkconfig -o ' + base_hardening_grub_config if ansible_os_family == 'RedHat' else 'update-grub' }}"
  when:
    - not base_hardening_in_container | bool
    - base_hardening_grub_audit is changed
  changed_when: true

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: "{{ base_hardening_auditd_service }}"
    state: started
    enabled: true
  when: not base_hardening_in_container | bool
