---
# Thin dispatcher. Each concern lives in its own file so `--tags` slices cleanly
# and so a failure points at one CIS section rather than a 900-line task list.

- name: Load OS-family specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"
  tags: [always]

- name: Assert the target platform is supported
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: >-
      base_hardening supports RedHat and Debian families only;
      this host reports ansible_os_family={{ ansible_os_family }}.
    quiet: true
  tags: [always]

# Containers have no real kernel, no systemd PID 1 in the normal case, and no
# mount table we own. Detect once, then let individual tasks opt out.
- name: Detect containerised test target
  ansible.builtin.set_fact:
    base_hardening_in_container: "{{ ansible_virtualization_type in ['docker', 'container', 'containerd', 'podman'] }}"
  tags: [always]

- name: Gather account facts used by several control groups
  ansible.builtin.include_tasks: facts.yml
  tags: [always]

- name: Filesystem controls (CIS 1.1)
  ansible.builtin.include_tasks: filesystem.yml
  when: base_hardening_filesystem_enabled | bool
  tags: [filesystem, cis1]

- name: Warning banners (CIS 1.7)
  ansible.builtin.include_tasks: banner.yml
  when: base_hardening_banner_enabled | bool
  tags: [banner, cis1]

- name: Time synchronisation (CIS 2.1)
  ansible.builtin.include_tasks: time.yml
  when: base_hardening_time_enabled | bool
  tags: [time, ntp, cis2]

- name: Remove unnecessary services (CIS 2.2)
  ansible.builtin.include_tasks: services.yml
  when: base_hardening_services_enabled | bool
  tags: [services, cis2]

- name: Kernel network parameters (CIS 3.1-3.3)
  ansible.builtin.include_tasks: sysctl.yml
  when: base_hardening_sysctl_enabled | bool
  tags: [sysctl, kernel, cis3]

- name: Host firewall (CIS 3.4)
  ansible.builtin.include_tasks: firewall.yml
  when: base_hardening_firewall_enabled | bool
  tags: [firewall, cis3]

- name: Audit daemon (CIS 4.1)
  ansible.builtin.include_tasks: auditd.yml
  when: base_hardening_auditd_enabled | bool
  tags: [auditd, audit, cis4]

- name: Log file permissions (CIS 4.2)
  ansible.builtin.include_tasks: logging.yml
  when: base_hardening_logging_enabled | bool
  tags: [logging, cis4]

- name: SSH server configuration (CIS 5.2)
  ansible.builtin.include_tasks: ssh.yml
  when: base_hardening_ssh_enabled | bool
  tags: [ssh, cis5]

- name: PAM password quality and lockout (CIS 5.3)
  ansible.builtin.include_tasks: pam.yml
  when: base_hardening_pam_enabled | bool
  tags: [pam, password, cis5]

- name: Account and shadow-suite policy (CIS 5.4)
  ansible.builtin.include_tasks: accounts.yml
  when: base_hardening_accounts_enabled | bool
  tags: [accounts, cis5]

- name: Critical file permissions (CIS 6.1)
  ansible.builtin.include_tasks: permissions.yml
  when: base_hardening_permissions_enabled | bool
  tags: [permissions, cis6]
