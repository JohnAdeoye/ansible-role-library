---
# CIS 2.1 — time synchronisation. Accurate clocks are a prerequisite for audit
# logs and TLS to mean anything.

- name: Install chrony
  ansible.builtin.package:
    name: "{{ base_hardening_time_package }}"
    state: present

- name: Configure chrony
  ansible.builtin.template:
    src: "{{ base_hardening_time_template }}"
    dest: "{{ base_hardening_time_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: "{{ base_hardening_time_service }}"
    state: started
    enabled: true
  when: not base_hardening_in_container | bool

# systemd-timesyncd competes with chrony for the clock. Only one may own it.
- name: Mask systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true
  when: not base_hardening_in_container | bool
  failed_when: false
